<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7fa">
<title>내 일정</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f6fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:600px;margin:auto;padding:20px 12px 100px}h1{font-size:30px}.panel{background:white;border-radius:22px;padding:14px;margin-bottom:14px}.month{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:bold}.month button{border:0;background:white;font-size:25px}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week div{text-align:center;padding:12px 0;color:#777}.day{min-height:66px;border-top:1px solid #eee;padding:4px 1px;overflow:hidden}.date{text-align:center;padding:4px 0;font-size:13px}.today{background:#202838;color:white;border-radius:50%;width:25px;margin:auto}.bar{height:19px;font-size:10px;white-space:nowrap;overflow:hidden;padding:3px;background:#d8e9ff;margin-top:3px}.pink{background:#ffdce5}.green{background:#d9f7e5}.purple{background:#eadfff}.yellow{background:#fff0c5}.single{border-radius:6px}.start{border-radius:6px 0 0 6px}.end{border-radius:0 6px 6px 0}.agenda h2{font-size:18px}.item{padding:12px;border-radius:12px;margin:7px 0;background:#d8e9ff}.item button{float:right;border:0;background:transparent}.entry{position:fixed;bottom:0;left:0;right:0;padding:12px;background:#fffffff2;display:flex;gap:8px;max-width:600px;margin:auto}.entry input{min-width:0;flex:1;border:1px solid #ddd;border-radius:25px;padding:13px}.entry button{border:0;border-radius:50%;width:44px;background:#202838;color:white;font-size:20px}
</style>
</head>
<body><main class="app"><h1>내 일정</h1><section class="panel"><div class="month"><button id="prev">‹</button><span id="label"></span><button id="next">›</button></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="grid" id="grid"></div></section><section class="panel agenda" id="agenda"></section></main><form class="entry" id="form"><input id="input" placeholder="예: 내일 카페 미열 오픈 12시부터 16시"><button>↑</button></form>
<script>
const $=id=>document.getElementById(id),today=new Date();today.setHours(0,0,0,0);let view=new Date(today.getFullYear(),today.getMonth(),1),selected=key(today),events=[];try{events=JSON.parse(localStorage.getItem('cal-events')||'[]')}catch(e){}
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function date(s){let a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function plus(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function render(){$('label').textContent=view.getFullYear()+'년 '+(view.getMonth()+1)+'월';let first=new Date(view.getFullYear(),view.getMonth(),1),start=plus(first,-first.getDay());$('grid').innerHTML='';for(let i=0;i<42;i++){let d=plus(start,i),k=key(d),cell=document.createElement('div');cell.className='day';let n=document.createElement('div');n.className='date';if(k===key(today))n.classList.add('today');n.textContent=d.getDate();cell.append(n);events.filter(e=>e.start<=k&&e.end>=k).slice(0,2).forEach(e=>{let b=document.createElement('div');b.className='bar '+e.color+(e.start===k&&e.end===k?' single':e.start===k?' start':e.end===k?' end':'');b.textContent=e.start===k?e.title:' ';cell.append(b)});cell.onclick=()=>{selected=k;render()};if(k===selected)cell.style.background='#fff3f6';$('grid').append(cell)}let list=events.filter(e=>e.start<=selected&&e.end>=selected);$('agenda').innerHTML='<h2>'+selected+' 일정</h2>';if(!list.length)$('agenda').innerHTML+='<p style="color:#888">등록된 일정이 없어요</p>';list.forEach(e=>{let el=document.createElement('div');el.className='item '+e.color;el.textContent=e.title+' · '+(e.allDay?'종일':e.timeStart+'–'+e.timeEnd);let b=document.createElement('button');b.textContent='×';b.onclick=()=>{events=events.filter(x=>x.id!==e.id);save();render()};el.append(b);$('agenda').append(el)})}
function save(){localStorage.setItem('cal-events',JSON.stringify(events))}
$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()}
$('form').onsubmit=e=>{e.preventDefault();let s=$('input').value.trim();if(!s)return;let d=new Date(today),rules=[[/내일\s*모레|모레/,2],[/글피/,3],[/내일/,1],[/오늘/,0]];for(let [re,n] of rules)if(re.test(s)){d=plus(today,n);s=s.replace(re,' ');break}let start=key(d),end=start,m=s.match(/(\d+)일\s*(?:동안|간)/);if(m){end=key(plus(d,Number(m[1])-1));s=s.replace(m[0],' ')}let a=s.match(/(\d{1,2})시?\s*(?:부터|~|-)\s*(\d{1,2})시?/),timeStart='',timeEnd='';if(a){timeStart=String(+a[1]).padStart(2,'0')+':00';timeEnd=String(+a[2]).padStart(2,'0')+':00';s=s.replace(a[0],' ')}let category='개인',color='green';for(let [name,c] of [['카페','pink'],['❤️','purple'],['집','green']])if(s.includes(name)){category=name;color=c;s=s.replace(name,' ');break}let title=s.replace(/\s+/g,' ').trim();if(!title){alert('일정 이름을 입력해 줘');return}if(!confirm('일정: '+title+'\n날짜: '+start+(end!==start?' ~ '+end:'')+'\n시간: '+(timeStart?timeStart+'–'+timeEnd:'종일')+'\n저장할까요?'))return;events.push({id:Date.now(),title,start,end,category,color,timeStart,timeEnd,allDay:!timeStart});save();selected=start;view=new Date(d.getFullYear(),d.getMonth(),1);$('input').value='';render()};render();
</script></body></html>
